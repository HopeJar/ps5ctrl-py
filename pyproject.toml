[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ps5ctrl"
version = "0.1.0"
description = "Readable PS5 DualSense controller helpers for Python projects."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "HopeJar" }
]
dependencies = [
    "pydualsense",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = [
    "pdoc",
    "tox",
]

[project.urls]
Homepage = "https://github.com/HopeJar/ps5ctrl-py"
Repository = "https://github.com/HopeJar/ps5ctrl-py"
Issues = "https://github.com/HopeJar/ps5ctrl-py/issues"

[project.scripts]
ps5ctrl-debug = "ps5ctrl.debug_inputs:main"

[tool.setuptools.packages.find]
include = ["ps5ctrl*"]