[tox]
envlist = py312
skipsdist = True

[testenv]
deps = -r requirements.txt
passenv = DISPLAY
ignore_errors = True
commands = 
    python3 -m pdoc -o reports/doc src/ps5ctrl
    ; python3 -m coverage run --source src -m pytest --
    ; python3 -m coverage html -d reports/coverage
    ; python3 -m flake8 --docstring-convention google --format=html --htmldir=reports/flake --exclude=.venv,.tox
    python3 -m pdoc --html --force --output-dir reports/doc .
